<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Online MBA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Poppins', 'sans-serif'] },
        colors: {
          primary: { DEFAULT: '#0356cf', foreground: '#eff6ff' },
          cardbg: '#eff6ff'
        }
      }
    }
  }
</script>
<style>
  body { font-family: 'Poppins', sans-serif; }
  .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body class="bg-white text-[#09090b]">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-white border-b border-gray-200">
    <div class="max-w-[1068px] mx-auto flex items-center justify-between px-4 py-3">
      <div class="flex items-center gap-2">
        <div id="brandInitial" class="w-9 h-9 rounded bg-primary text-white flex items-center justify-center font-semibold text-sm"></div>
        <!-- src is set from content.json (site.brandLogo) so it's editable in /admin -->
        <img id="brandLogo" src="" alt="" class="hidden w-9 h-9 rounded object-contain" />
        <div class="leading-tight">
          <div id="brandName" class="font-semibold text-sm"></div>
          <div id="brandTagline" class="text-xs text-gray-500"></div>
        </div>
      </div>
      <a id="callNowBtn" href="#" class="inline-flex items-center gap-2 bg-primary text-primary-foreground text-sm font-medium rounded-md px-4 py-2 hover:bg-primary/90">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        Call Now
      </a>
    </div>
  </header>

  <!-- Hero + listings -->
  <section class="py-10 bg-gray-100 min-h-[86vh]">
    <div class="max-w-[1068px] mx-auto px-4">
      <span id="heroBadge" class="text-sm text-gray-500"></span>
      <h1 id="heroHeading" class="text-2xl font-semibold mt-1"></h1>
      <p id="heroSubheading" class="text-gray-600 mt-2"></p>

      <div class="mt-6 flex justify-end">
        <div class="relative w-full sm:w-72">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input id="searchInput" type="text" placeholder="Search Universities"
            class="w-full pl-9 pr-3 py-2 text-sm border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-primary/30" />
        </div>
      </div>

      <div id="listings" class="flex flex-col gap-4 mt-6"></div>
      <div id="noResults" class="hidden text-center text-gray-500 py-10">No universities match your search.</div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-[#0b0f1a] text-gray-300 text-center text-sm py-4">
    <span id="copyrightText"></span>
  </footer>

  <!-- Lead form modal -->
  <div id="leadModal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center px-4">
    <div class="bg-white rounded-lg w-full max-w-md p-6 relative">
      <button id="closeModal" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600" aria-label="Close">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <h2 id="formTitle" class="text-lg font-semibold"></h2>
      <p id="formSubtitle" class="text-sm text-gray-500 mt-1"></p>
      <p id="formForUniversity" class="text-sm font-medium text-primary mt-2"></p>

      <form id="leadForm" class="mt-4 space-y-3">
        <input type="text" name="name" required placeholder="Full name"
          class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30" />
        <input type="tel" name="phone" required placeholder="Phone number"
          class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30" />
        <input type="email" name="email" placeholder="Email (optional)"
          class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30" />
        <input type="hidden" name="university" />
        <button type="submit" class="w-full bg-primary text-primary-foreground font-medium rounded-md py-2 text-sm hover:bg-primary/90">
          Submit
        </button>
      </form>
      <p id="formStatus" class="text-sm mt-3"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
